kind = "web"
previewPath = "/"
title = "UNHINGED"
description = "A mobile-first interactive prototype of the UNHINGED corporate roast party game, covering the full create, join, lobby, answering, voting, power, and results flow."
version = "1.0.0"
id = "artifacts/unhinged-game"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23984

[services.development]
run = "pnpm --filter @workspace/unhinged-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/unhinged-game", "run", "build" ]
serve = "static"
publicDir = "artifacts/unhinged-game/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23984"
BASE_PATH = "/"
